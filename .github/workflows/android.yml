name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Build :demo (assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          token: ${{ github.token }}
      - uses: gradle/actions/setup-gradle@v5
      - name: Assemble debug APK
        run: ./gradlew :demo:assembleDebug --no-configuration-cache

      - name: List APK output
        run: ls -la demo/build/outputs/apk/debug/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: demo/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
